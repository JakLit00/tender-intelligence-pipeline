tender_intelligence:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('APP_DB_HOST') }}"
      port: "{{ env_var('APP_DB_PORT') | int }}"
      dbname: "{{ env_var('APP_DB_NAME') }}"
      user: tender_dbt
      password: "{{ env_var('DBT_DB_PASSWORD') }}"
      schema: analytics
      threads: 2
      connect_timeout: 10