[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-intelligence-pipeline"
version = "0.1.0"
description = "A data pipeline for monitoring Polish IT procurement notices from TED."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2.3,<3",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]