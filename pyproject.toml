[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-intelligence-pipeline"
version = "0.1.0"
description = "A data pipeline for monitoring Polish IT procurement notices from TED."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2.3,<3",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
extend-exclude = [
    ".venv-dbt",
    "dbt/target",
    "dbt/dbt_packages",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"